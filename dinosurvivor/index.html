<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino Survivor: ADADINOSAUR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto+Mono:wght@500;700&display=swap');

        :root {
            --bg-color: #0f0f0f;
            --ui-bg: rgba(10, 10, 12, 0.9);
            --ui-border: rgba(243, 156, 18, 0.5);
            --accent-color: #f39c12;
            --hp-color: #e74c3c;
            --xp-color: #3498db;
            --text-shadow: 2px 2px 0 #000;
        }

        body {
            margin: 0; overflow: hidden; background-color: var(--bg-color);
            font-family: 'Roboto Mono', monospace;
            color: #fff; user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        canvas { display: block; image-rendering: pixelated; }

        /* PRELOADER */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column;
            transition: opacity 1s ease-out;
        }
        .logo-text {
            font-family: 'Black Ops One', cursive;
            font-size: clamp(40px, 8vw, 100px);
            background: linear-gradient(to bottom, #f1c40f, #d35400);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            animation: pulse 1.5s infinite;
            text-shadow: 0 0 20px rgba(243, 156, 18, 0.5);
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

        /* UI LAYOUT */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px; box-sizing: border-box;
        }

        #hud {
            display: flex; justify-content: space-between; align-items: flex-start;
            width: 100%;
        }

        /* BARS */
        .stat-box {
            display: flex; flex-direction: column; gap: 4px;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.8));
        }
        
        .bar-frame {
            width: 25vw; min-width: 180px; max-width: 350px; height: 28px;
            background: #111; border: 2px solid #444; border-radius: 4px;
            position: relative; overflow: hidden;
        }
        
        .bar-fill { height: 100%; transition: width 0.2s; box-shadow: inset 0 2px 5px rgba(255,255,255,0.2); }
        #hp-bar { background: linear-gradient(90deg, #c0392b, #e74c3c); width: 100%; }
        #xp-bar { background: linear-gradient(90deg, #2980b9, #3498db); width: 0%; }

        .bar-text {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 2;
        }

        .stat-label { font-size: 14px; color: #aaa; font-weight: bold; letter-spacing: 1px; }
        .stat-val { color: #fff; font-size: 16px; color: var(--accent-color); }

        /* TIMER */
        #timer-container {
            background: rgba(0,0,0,0.6); border: 2px solid var(--ui-border);
            padding: 5px 15px; border-radius: 20px; backdrop-filter: blur(4px);
        }
        #timer-display { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: 2px; }

        /* MENUS */
        .menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; flex-direction: column;
            pointer-events: auto; z-index: 100; backdrop-filter: blur(8px);
        }

        .menu-box {
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border: 2px solid var(--accent-color);
            padding: 40px; border-radius: 12px; text-align: center;
            box-shadow: 0 0 50px rgba(243, 156, 18, 0.2);
            max-width: 800px; width: 90%; position: relative;
        }
        .menu-box::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--accent-color), transparent, var(--accent-color));
            z-index: -1; border-radius: 12px; opacity: 0.3;
        }

        h1 { 
            font-family: 'Black Ops One', cursive; 
            color: var(--accent-color); margin: 0 0 15px 0; 
            font-size: clamp(32px, 5vw, 56px); text-shadow: 0 0 15px rgba(243, 156, 18, 0.6);
        }
        
        button {
            background: linear-gradient(to bottom, #8e44ad, #6c3483);
            color: #fff; border: 1px solid #a569bd;
            padding: 15px 50px; font-size: 20px; cursor: pointer; margin-top: 25px;
            font-family: 'Black Ops One', cursive; text-transform: uppercase;
            box-shadow: 0 5px 0 #3b1a47; border-radius: 6px; transition: 0.1s;
        }
        button:active { transform: translateY(4px); box-shadow: 0 1px 0 #3b1a47; }

        /* UPGRADE CARDS */
        #upgrade-container { display: flex; gap: 15px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
        .upgrade-card {
            background: #2c3e50; border: 2px solid #34495e;
            padding: 15px; width: 140px; cursor: pointer; transition: 0.2s;
            border-radius: 8px; display: flex; flex-direction: column; align-items: center;
            position: relative; overflow: hidden;
        }
        .upgrade-card:hover { transform: translateY(-5px); border-color: var(--accent-color); background: #354a60; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card-icon { font-size: 40px; margin-bottom: 10px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
        .upgrade-type { font-size: 10px; text-transform: uppercase; color: #95a5a6; letter-spacing: 1px; margin-bottom: 5px; }
        .upgrade-title { color: var(--accent-color); font-weight: bold; margin-bottom: 5px; font-size: 14px; text-transform: uppercase; }
        .upgrade-desc { font-size: 11px; color: #ecf0f1; line-height: 1.3; }
        .new-badge { 
            background: #c0392b; color: white; padding: 3px 8px; font-size: 10px; font-weight: bold;
            position: absolute; top: 0; right: 0; border-bottom-left-radius: 8px; 
        }

        /* JOYSTICK */
        #joystick-zone {
            position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px;
            background: rgba(255,255,255,0.05); border-radius: 50%; pointer-events: auto;
            display: none; touch-action: none; border: 2px dashed rgba(255,255,255,0.1);
        }
        #joystick-knob {
            width: 50px; height: 50px; background: rgba(241, 196, 15, 0.4);
            border-radius: 50%; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.3); border: 2px solid rgba(255,255,255,0.5);
        }
        @media (hover: none) and (pointer: coarse) { #joystick-zone { display: block; } }

    </style>

const Assets = {};
function generateSprite(key, width, height, pixels, palette, scale = 1) {
    const c = document.createElement('canvas');
    c.width = width * scale; c.height = height * scale;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const char = pixels[y * width + x];
            if (char && char !== ' ' && char !== '.') {
                ctx.fillStyle = palette[char];
                ctx.fillRect(x * scale, y * scale, scale, scale);
            }
        }
    }
    Assets[key] = c;
}

function updateShield(w, dt) {

        projectiles.push({ type: 'shield_rock', parentId: w.id, x: player.x + Math.cos(ang) * w.area, y: player.y + Math.sin(ang) * w.area, dmg: w.dmg, area: 12, life: 0.1, knockback: w.knockback });

function fireWeapon(w) {
    if(w.type === 'bone' || w.type === 'venom') {

        for(let i=0; i<w.count; i++) { let spread = (i - (w.count-1)/2) * 0.3; projectiles.push({ type: w.type, x: player.x, y: player.y, angle: angle+spread, speed: w.speed, dmg: w.dmg, life: 2.0, pierce: w.pierce, rot: 0, knockback: w.knockback }); }
    }

                if(next) { targets.push(next); curr = next; } else break;
            }
            if(targets.length > 0) sfx('zap');
            let prevX = player.x, prevY = player.y;

}

/* =========================================
   JAGGED LIGHTNING ALGORITHM
   ========================================= */
function createLightning(x1, y1, x2, y2) {
    const segments = 5; // More segments = more jagged
    let cx = x1, cy = y1;
    for(let i=1; i<=segments; i++) {
        const t = i / segments;
        let tx = x1 + (x2 - x1) * t;
        let ty = y1 + (y2 - y1) * t;
        // Add jitter only for middle points
        if (i < segments) {
            const offset = (Math.random() - 0.5) * 40; // Jitter amount
            tx += offset; ty += offset;
        }
        projectiles.push({ type: 'lightning_seg', x1: cx, y1: cy, x2: tx, y2: ty, life: 0.15 });
        cx = tx; cy = ty;
    }
}
